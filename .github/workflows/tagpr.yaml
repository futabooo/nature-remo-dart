name: tagpr

# 全てのactionsをGitHub Appのトークンで実行することでtagが打たれたことをトリガーとするアクションが実行されるようにする
# tagprが作るPull Request上でtestのアクションを実行するだけならtagprのstepだけ違うトークンでも良い

on:
  push:
    branches: ["main"]
    # ライブラリに関係ないファイルだけの変更では release PR を作らない。
    # tagpr PR 自体のマージは pubspec.yaml と CHANGELOG.md を変えるので
    # タグ付けのトリガーは従来どおり動く
    paths-ignore:
      - ".github/**"
      - ".devcontainer/**"
      - ".claude/**"
      - "renovate.json"
      - ".tool-versions"

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
